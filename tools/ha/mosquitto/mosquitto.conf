# Mosquitto configuration for the Moggie development rig only.
#
# Anonymous access is intentional: this broker is bound to a host port on a
# developer machine and exists to exercise MQTT discovery. Do not copy this file
# into anything reachable from a network you do not own.
#
# A real deployment belongs behind the speaker's own credentials, with
# `allow_anonymous false` and a password file.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Retained discovery documents are the whole point of the rig, so keep the
# queue generous and do not expire them.
max_queued_messages 1000
max_packet_size 65535
